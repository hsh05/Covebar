<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Animated preview of the Covebar dock: the bar slides up, a timer card counts down, the calendar opens from the clock, a right-click menu appears, then the bar slides away.">
<title>Covebar in action</title>
<style>
text { font-family: Segoe UI Variable Text, Segoe UI, system-ui, -apple-system, sans-serif; fill: #e8edf2; }
.dim { fill: #93a0ad; }
.ico { fill: none; stroke: #dfe6ec; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.card { fill: #1b2127; stroke: rgba(255,255,255,.09); }
.pop { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; }
.bar { animation: bar 12s cubic-bezier(.32,.72,0,1) infinite; }
@keyframes bar { 0%,5% { transform: translateY(78px); } 11%,90% { transform: translateY(0); } 97%,100% { transform: translateY(78px); } }
@keyframes timerCard { 0%,15.5% { opacity:0; transform: translateY(12px) scale(.94); } 18.5%,40% { opacity:1; transform: none; } 43%,100% { opacity:0; transform: translateY(8px) scale(.97); } }
@keyframes calCard { 0%,48.5% { opacity:0; transform: translateY(12px) scale(.94); } 51.5%,67% { opacity:1; transform: none; } 70%,100% { opacity:0; transform: translateY(8px) scale(.97); } }
@keyframes menu { 0%,73.5% { opacity:0; transform: translateY(8px) scale(.96); } 75.5%,86% { opacity:1; transform: none; } 88%,100% { opacity:0; transform: scale(.98); } }
@keyframes cursor {
  0% { transform: translate(640px, 300px); }
  6% { transform: translate(640px, 462px); }
  10% { transform: translate(640px, 440px); }
  14%,42% { transform: translate(592px, 418px); }
  47%,68% { transform: translate(985px, 418px); }
  72%,87% { transform: translate(880px, 418px); }
  89% { transform: translate(902px, 330px); }
  95%,100% { transform: translate(760px, 250px); }
}
@keyframes ring { 0%,18.5% { stroke-dashoffset: 0; } 40%,100% { stroke-dashoffset: 402; } }
@keyframes hlTimer { 0%,13% { opacity:0; } 14%,42% { opacity:1; } 44%,100% { opacity:0; } }
@keyframes hlClock { 0%,46% { opacity:0; } 47%,68% { opacity:1; } 70%,100% { opacity:0; } }
@keyframes hlSun { 0%,71% { opacity:0; } 72%,87% { opacity:1; } 89%,100% { opacity:0; } }
@keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@keyframes d5 { 0%,22.79% { opacity:1; } 22.80%,100% { opacity:0; } }
@keyframes d4 { 0%,22.79% { opacity:0; } 22.80%,27.09% { opacity:1; } 27.10%,100% { opacity:0; } }
