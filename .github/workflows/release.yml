# Builds the Windows installer and publishes a GitHub release with the signed update
# (latest.json) that installed copies of Covebar check for.
#
# To release: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, commit, then push a tag such as v0.2.0.
#
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY (the contents of the private key
# made with `npx tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the
# key has no password).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend packages
        run: npm install --no-audit --no-fund # npm ci trips over optional wasm deps missing from the lock (npm bug)

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Covebar v__VERSION__
          releaseBody: See the commits since the last release for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
